# Integração contínua do TaskAnalyzer (Fase 3).
# Roda o Test Harness a cada push ou pull request nas branches main e develop.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite rodar de novo pela aba Actions

jobs:
  testes:
    name: Testes (pytest, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Test Harness
        run: pytest tests/test_harness.py -v
